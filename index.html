<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7e8"><link rel="manifest" href="manifest.json"><title>MRG Growth Tracker</title><style>
:root{--bg:#fff7e8;--card:#fffdf8;--ink:#33291f;--muted:#827566;--line:#eee1cf;--accent:#8b5e34;--green:#18834b;--soft:#e8f2e4;--red:#c94b42} [data-theme=dark]{--bg:#242621;--card:#30332c;--ink:#fff1d8;--muted:#c0b5a3;--line:#484a40;--accent:#d6a66d;--green:#8ed29b;--soft:#3d493a;--red:#ff9285}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui;padding-bottom:80px}.hero{padding:22px 17px;background:linear-gradient(135deg,var(--card),var(--soft));border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.logo{background:var(--accent);color:white;border-radius:15px;padding:14px;font-weight:900}h1{font-size:21px;margin:0}p{color:var(--muted);margin:4px 0}.wrap{max-width:760px;margin:auto}main{padding:14px;display:grid;gap:12px}.card,.stat,.cat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px}.stats,.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat strong{display:block;font-size:24px}.muted{color:var(--muted);font-size:12px}.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}button{border:0;border-radius:11px;background:var(--accent);color:white;padding:10px 13px;font-weight:700}button.alt{background:var(--soft);color:var(--ink)}.field{display:grid;gap:5px;margin:9px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;width:100%}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.task{display:flex;gap:9px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}.task:last-child{border:0}.tick{padding:3px;width:25px;height:25px;background:transparent;color:var(--ink);border:2px solid var(--muted)}.task.done .tick{background:var(--green);border-color:var(--green);color:white}.task.done .name{text-decoration:line-through;color:var(--muted)}.taskbody{flex:1}.name{font-weight:700}.badge{color:var(--red);font-size:11px;font-weight:800}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:7px}.tabs div{width:100%;max-width:760px;display:flex;justify-content:space-around}.tabs button{background:transparent;color:var(--muted);padding:8px 4px}.tabs button.active{background:var(--soft);color:var(--green)}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.filters button{background:var(--soft);color:var(--ink);font-size:12px}.filters button.active{background:var(--accent);color:white}.hidden{display:none}.empty{text-align:center;padding:15px;color:var(--muted)}@media(min-width:600px){main{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.cats{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="wrap"><header class="hero"><div class="brand"><div class="logo">MRG</div><div><h1>MRG Growth Tracker</h1><p>Plan Better · Track Deeper · Grow Faster</p></div><button id="theme" class="alt">☀️</button></div><p id="date" style="margin-top:15px"></p></header><main id="app"></main><nav class="tabs"><div><button data-page="home" class="active">⌂ Home</button><button data-page="tasks">☷ Tasks</button><button data-page="reports">▥ Reports</button><button data-page="settings">⚙ Settings</button></div></nav></div><script>
const cats={Home:'🏠',Office:'💼',Study:'📚',Personal:'👤'};let s=JSON.parse(localStorage.getItem('mrgdata')||'null')||{tasks:[],theme:'light',lang:'hi'};let page='home',filter='All',catfilter='All',range='Daily',editId=null,timer={};
const $=x=>document.querySelector(x),today=()=>new Date().toISOString().slice(0,10),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('hi-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),save=()=>{localStorage.setItem('mrgdata',JSON.stringify(s));render()},dur=n=>n<60?n+' min':Math.floor(n/60)+'h '+n%60+'m',esc=x=>String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sum(a){let d=a.filter(t=>t.done).length;return {all:a.length,done:d,pct:a.length?Math.round(d/a.length*100):0,mins:a.reduce((n,t)=>n+(t.actual||0),0)}}
function bar(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>'}
function card(title,body,wide=true){return '<section class="card '+(wide?'wide':'')+'"><h3 style="margin:0 0 10px">'+title+'</h3>'+body+'</section>'}
function task(t){return '<div class="task '+(t.done?'done':'')+'"><button class="tick" data-do="toggle" data-id="'+t.id+'">'+(t.done?'✓':'')+'</button><div class="taskbody"><div class="name">'+esc(t.title)+' '+(t.important?'<span class="badge">⭐ IMPORTANT</span>':'')+'</div><div class="muted">'+cats[t.cat]+' '+t.cat+' · '+t.date+' · '+(t.actual?dur(t.actual):t.estimate?('अनुमान '+dur(t.estimate)):'समय सेट नहीं')+(t.done&&t.completed?' · '+new Date(t.completed).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'')+'</div></div><button class="alt" data-do="timer" data-id="'+t.id+'">'+(t.started?'■':'▶')+'</button><button class="alt" data-do="edit" data-id="'+t.id+'">✎</button></div>'}
function form(){let t=s.tasks.find(x=>x.id===editId)||{};return card(editId?'Edit Task':'＋ नया टास्क जोड़ें','<form id="form"><div class="field"><label>काम का नाम *</label><input id="title" required maxlength="120" value="'+esc(t.title)+'" placeholder="जैसे: Cost Accounting पढ़ना"></div><div class="row"><div class="field"><label>Category *</label><select id="cat">'+Object.keys(cats).map(c=>'<option '+(t.cat===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="field"><label>Due Date</label><input id="due" type="date" value="'+(t.date||today())+'"></div></div><div class="row"><div class="field"><label>Estimated minutes</label><input id="estimate" type="number" min="1" value="'+(t.estimate||'')+'" placeholder="30"></div><div class="field"><label>Priority</label><select id="priority"><option>Normal</option><option '+(t.priority==='High'?'selected':'')+'>High</option><option '+(t.priority==='Urgent'?'selected':'')+'>Urgent</option></select></div></div><div class="field"><label>Notes</label><textarea id="note" rows="2">'+esc(t.note)+'</textarea></div><label><input id="important" type="checkbox" style="width:auto" '+(t.important?'checked':'')+'> ⭐ Important — सबसे ऊपर</label><div class="row" style="margin-top:12px"><button type="submit">Save Task</button><button type="button" id="cancel" class="alt">Cancel</button></div></form>')}
function home(){let a=s.tasks.filter(t=>t.date===today()),z=sum(a),all=sum(s.tasks),top=s.tasks.filter(t=>t.important&&!t.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);return '<div class="stats wide"><div class="stat"><strong>'+z.all+'</strong><span class="muted">आज के टास्क</span></div><div class="stat"><strong>'+z.done+'</strong><span class="muted">पूरे हुए</span></div><div class="stat"><strong>'+z.pct+'%</strong><span class="muted">प्रगति</span></div></div>'+card('आज की प्रगति',bar(z.pct)+'<p class="muted">'+z.done+' / '+z.all+' पूरे · कुल वास्तविक समय '+dur(all.mins)+'</p>')+card('चार कैटेगरी','<div class="cats">'+Object.keys(cats).map(c=>{let x=sum(s.tasks.filter(t=>t.cat===c));return '<div class="cat" data-cat="'+c+'"><div style="font-size:23px">'+cats[c]+'</div><b>'+c+'</b><p class="muted">'+x.done+'/'+x.all+' पूरे · '+x.pct+'%</p>'+bar(x.pct)+'</div>'}).join('')+'</div>')+card('🎯 Today’s Top 3',top.map(task).join('')||'<div class="empty">अभी Important Task नहीं है।</div>')+card('आज के टास्क <button data-add="1" style="float:right">＋ Add</button>',a.sort((x,y)=>Number(y.important)-Number(x.important)).map(task).join('')||'<div class="empty">आज कोई टास्क नहीं। पहला टास्क जोड़ें ✨</div>')+form()}
function tasksPage(){let a=s.tasks.filter(t=>(catfilter==='All'||t.cat===catfilter)&&(filter==='All'||filter==='Completed'&&t.done||filter==='Pending'&&!t.done||filter==='Overdue'&&!t.done&&t.date<today())).sort((x,y)=>Number(y.important)-Number(x.important)||Number(x.done)-Number(y.done)||x.date.localeCompare(y.date));return card('Tasks','<div class="filters">'+['All',...Object.keys(cats)].map(c=>'<button class="'+(catfilter===c?'active':'')+'" data-catfilter="'+c+'">'+c+'</button>').join('')+'</div><div class="filters">'+['All','Pending','Completed','Overdue'].map(c=>'<button class="'+(filter===c?'active':'')+'" data-filter="'+c+'">'+c+'</button>').join('')+'</div>'+a.map(task).join('')||'<div class="empty">कोई टास्क नहीं</div>')+form()}
function reports(){let ranges=['Daily','Weekly','Monthly','Yearly'];let a=s.tasks.filter(t=>{let d=new Date((t.date||today())+'T12:00:00'),n=new Date();if(range==='Daily')return t.date===today();if(range==='Weekly'){let x=new Date();x.setDate(x.getDate()-6);return d>=new Date(x.toDateString())}if(range==='Monthly')return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();return d.getFullYear()===n.getFullYear()}),z=sum(a);return card('Reports','<div class="filters">'+ranges.map(r=>'<button data-range="'+r+'" class="'+(range===r?'active':'')+'">'+r+'</button>').join('')+'</div><div class="stats"><div class="stat"><strong>'+z.all+'</strong><span>Total</span></div><div class="stat"><strong>'+z.done+'</strong><span>Completed</span></div><div class="stat"><strong>'+z.pct+'%</strong><span>Completion</span></div></div><h3>Category Progress</h3>'+Object.keys(cats).map(c=>{let q=sum(a.filter(t=>t.cat===c));return '<p>'+cats[c]+' '+c+' · '+q.pct+'%</p>'+bar(q.pct)}).join('')+'<p>Actual time: '+dur(z.mins)+' · Pending: '+z.all-z.done+'</p><p class="muted">रिपोर्ट दर्ज किए गए टास्क डेटा से बनती है।</p>')+card('Backup & Export','<button id="backup">Download JSON Backup</button> <button id="csv" class="alt">Export CSV</button> <label class="alt" style="display:inline-block;padding:10px;border-radius:10px">Restore JSON <input id="restore" type="file" accept=".json" hidden></label>')}
function settings(){return card('Settings','<div class="field"><label>Theme</label><select id="themeSelect"><option value="light" '+(s.theme==='light'?'selected':'')+'>Warm Light</option><option value="dark" '+(s.theme==='dark'?'selected':'')+'>Warm Dark</option></select></div><div class="field"><label>Language</label><select id="language"><option value="hi">हिंदी + English</option><option value="en" '+(s.lang==='en'?'selected':'')+'>English</option></select></div><p class="muted">Data is saved in this browser on this device. Google login, Cloud Sync, app lock and notifications are not configured in this prototype.</p><button id="backup">Backup Data</button> <button id="clear" class="alt">Clear All Tasks</button>')}
function render(){document.documentElement.dataset.theme=s.theme;$('#date').textContent=fmt(today());$('#theme').textContent=s.theme==='dark'?'🌙':'☀️';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#app').innerHTML=page==='home'?home():page==='tasks'?tasksPage():page==='reports'?reports():settings();bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;editId=null;render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{catfilter=b.dataset.cat;page='tasks';render()});document.querySelectorAll('[data-catfilter]').forEach(b=>b.onclick=()=>{catfilter=b.dataset.catfilter;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>$('#title').focus());document.querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>act(b.dataset.do,b.dataset.id));$('#form')?.addEventListener('submit',e=>{e.preventDefault();let old=s.tasks.find(t=>t.id===editId);let t={id:editId||String(Date.now()),title:$('#title').value.trim(),cat:$('#cat').value,date:$('#due').value||today(),estimate:+$('#estimate').value||0,priority:$('#priority').value,note:$('#note').value,important:$('#important').checked,done:old?.done||false,completed:old?.completed||null,actual:old?.actual||0,started:old?.started||0};if(old)s.tasks=s.tasks.map(x=>x.id===editId?t:x);else s.tasks.push(t);editId=null;save()});$('#cancel')?.addEventListener('click',()=>{editId=null;render()});$('#theme').onclick=()=>{s.theme=s.theme==='dark'?'light':'dark';save()};$('#themeSelect')?.addEventListener('change',e=>{s.theme=e.target.value;save()});$('#language')?.addEventListener('change',e=>{s.lang=e.target.value;save()});$('#backup')?.addEventListener('click',backup);$('#csv')?.addEventListener('click',csv);$('#restore')?.addEventListener('change',restore);$('#clear')?.addEventListener('click',()=>{if(confirm('सभी टास्क हटाएँ?')){s.tasks=[];save()}})}
function act(a,id){let t=s.tasks.find(x=>x.id===id);if(!t)return;if(a==='toggle'){t.done=!t.done;t.completed=t.done?new Date().toISOString():null;if(t.done&&t.started){t.actual=(t.actual||0)+Math.max(1,Math.round((Date.now()-t.started)/60000));t.started=0}save()}if(a==='edit'){editId=id;page='tasks';render();$('#title').focus()}if(a==='timer'){if(t.started){t.actual=(t.actual||0)+Math.max(1,Math.round((Date.now()-t.started)/60000));t.started=0;alert('Timer stopped. Actual time: '+dur(t.actual))}else{t.started=Date.now();alert('Timer started: '+t.title)}save()}}
function dl(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){dl(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),'mrg-growth-tracker-backup.json')}function csv(){let rows=[['Title','Category','Date','Done','Important','Estimated Minutes','Actual Minutes'],...s.tasks.map(t=>[t.title,t.cat,t.date,t.done,t.important,t.estimate,t.actual])];dl(new Blob([rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}),'mrg-growth-tracker.csv')}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.tasks))throw 0;if(confirm('Backup restore करें?')){s=x;save()}}catch{alert('Invalid backup')}};r.readAsText(f)}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
